<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CompressPDF Pro</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="h-full bg-slate-950 text-slate-100 overflow-auto">
    <div class="min-h-full w-full flex">
      <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col shrink-0 hidden md:flex">
        <div class="p-5 border-b border-slate-800">
          <h1 class="text-lg font-bold text-amber-400 flex items-center gap-2">
            <i class="bi bi-lightning-charge-fill" style="font-size:20px;color:#f59e0b"></i>
            CompressPDF Pro
          </h1>
        </div>
        <nav class="flex-1 p-3 space-y-1">
          <button class="sidebar-item active w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium cursor-pointer" data-tool="compressor">
            <i class="bi bi-file-earmark-zip" style="font-size:18px"></i>
            PDF Compressor
          </button>
          <button class="sidebar-item w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-slate-400 cursor-pointer" data-tool="converter">
            <i class="bi bi-arrow-repeat" style="font-size:18px"></i>
            PDF Converter
          </button>
          <button class="sidebar-item w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-slate-400 cursor-pointer" data-tool="editor">
            <i class="bi bi-pencil-square" style="font-size:18px"></i>
            PDF Editor
          </button>
          <button class="sidebar-item w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-slate-400 cursor-pointer" data-tool="image">
            <i class="bi bi-image" style="font-size:18px"></i>
            Image Compressor
          </button>
        </nav>
        <div class="p-4 border-t border-slate-800 text-xs text-slate-500 text-center">
          (c) 2026 CompressPDF Pro
        </div>
      </aside>

      <main class="flex-1 p-6 overflow-auto">
        <div class="mx-auto w-full max-w-3xl">
          <nav class="mobile-tool-nav md:hidden" aria-label="Tools">
            <button class="sidebar-item active mobile-tool-btn" data-tool="compressor">
              <i class="bi bi-file-earmark-zip"></i>
              Compress
            </button>
            <button class="sidebar-item mobile-tool-btn text-slate-400" data-tool="converter">
              <i class="bi bi-arrow-repeat"></i>
              Convert
            </button>
            <button class="sidebar-item mobile-tool-btn text-slate-400" data-tool="editor">
              <i class="bi bi-pencil-square"></i>
              Edit
            </button>
            <button class="sidebar-item mobile-tool-btn text-slate-400" data-tool="image">
              <i class="bi bi-image"></i>
              Images
            </button>
          </nav>

          <h2 id="tool-title" class="text-2xl font-bold text-center mb-6">PDF Compressor</h2>

          <section id="compressor-panel" class="tool-panel">
            <div
              id="upload-zone"
              class="upload-zone border-2 border-dashed border-slate-700 rounded-2xl p-10 text-center cursor-pointer"
              onclick="document.getElementById('file-input').click()"
            >
              <div id="upload-icon" class="flex flex-col items-center gap-3">
                <div class="w-16 h-16 rounded-full bg-slate-800 flex items-center justify-center">
                  <i class="bi bi-cloud-upload" style="font-size:28px;color:#f59e0b"></i>
                </div>
                <p class="text-slate-400 text-sm">Click to browse or drag &amp; drop</p>
                <p class="text-slate-600 text-xs">PDF files only</p>
              </div>
              <div id="file-info" class="hidden">
                <div class="flex items-center justify-center gap-3">
                  <div class="w-12 h-12 rounded-xl bg-amber-500/10 flex items-center justify-center">
                    <i class="bi bi-file-earmark-text" style="font-size:24px;color:#f59e0b"></i>
                  </div>
                  <div class="text-left">
                    <p id="file-name" class="text-sm font-semibold truncate max-w-[260px]"></p>
                    <p id="file-size" class="text-xs text-slate-400"></p>
                  </div>
                </div>
              </div>
            </div>
            <input type="file" id="file-input" accept=".pdf,application/pdf" class="hidden">

            <div id="controls" class="hidden mt-6 bg-slate-900 rounded-2xl p-6 border border-slate-800">
              <div class="flex justify-between items-center mb-3">
                <span class="text-sm font-medium text-slate-300">Compression Level</span>
                <span id="percent-label" class="text-sm font-bold text-amber-400">50%</span>
              </div>
              <input type="range" id="compression-range" min="10" max="90" value="50" class="w-full bg-slate-700">
              <div class="flex justify-between mt-2 text-xs text-slate-500">
                <span>Low</span>
                <span>High</span>
              </div>

              <label for="target-size-input" class="block mt-5 text-sm font-medium text-slate-300">Target size</label>
              <div class="mt-2 flex items-center gap-2">
                <input type="number" id="target-size-input" min="1" step="1" class="field">
                <span class="text-sm font-semibold text-slate-400">KB</span>
              </div>

              <div class="mt-5 p-4 bg-slate-800 rounded-xl flex items-center justify-between gap-2">
                <div>
                  <p class="text-xs text-slate-400 mb-1">Original</p>
                  <p id="original-size-display" class="text-base font-bold text-white">-</p>
                </div>
                <div class="flex flex-col items-center flex-1">
                  <div class="w-full flex items-center gap-1">
                    <div class="h-1 flex-1 bg-slate-600 rounded"></div>
                    <i class="bi bi-arrow-right text-amber-400" style="font-size:16px"></i>
                    <div class="h-1 flex-1 bg-amber-500/40 rounded"></div>
                  </div>
                  <p id="saving-percent" class="text-xs font-semibold text-green-400 mt-2">-</p>
                </div>
                <div class="text-right">
                  <p class="text-xs text-slate-400 mb-1">Estimated</p>
                  <p id="estimated-size" class="text-base font-bold text-amber-400">-</p>
                </div>
              </div>

              <div id="progress-wrap" class="hidden mt-5">
                <div class="flex justify-between text-xs text-slate-400 mb-2">
                  <span id="progress-text">Compressing...</span>
                </div>
                <div class="w-full bg-slate-700 rounded-full h-2.5">
                  <div id="progress-bar" class="progress-bar h-2.5 rounded-full" style="width:0%;transition:width 0.25s ease"></div>
                </div>
              </div>

              <button id="compress-btn" class="primary-btn mt-5">
                <i class="bi bi-file-earmark-zip" style="font-size:18px"></i>
                Compress PDF
              </button>
              <button id="download-btn" class="success-btn hidden mt-3">
                <i class="bi bi-download" style="font-size:18px"></i>
                Download Compressed PDF
              </button>
              <div id="success-msg" class="hidden mt-4 p-4 bg-green-900/30 border border-green-700 rounded-xl text-center text-green-300 text-sm font-medium">
                <span id="success-text">Compression complete</span>
              </div>
            </div>
          </section>

          <section id="converter-panel" class="tool-panel hidden">
            <div class="tool-card space-y-5">
              <div>
                <label class="label" for="converter-mode">Conversion</label>
                <select id="converter-mode" class="field mt-2">
                  <option value="pdf-to-jpg">PDF to JPG</option>
                  <option value="image-to-pdf">Images to PDF</option>
                </select>
              </div>
              <div>
                <label class="label" for="converter-files">Files</label>
                <input id="converter-files" type="file" accept=".pdf,application/pdf" class="file-field mt-2">
              </div>
              <button id="convert-btn" class="primary-btn">
                <i class="bi bi-arrow-repeat" style="font-size:18px"></i>
                Convert
              </button>
              <p id="converter-status" class="status-text"></p>
            </div>
          </section>

          <section id="editor-panel" class="tool-panel hidden">
            <div class="tool-card space-y-5">
              <div>
                <label class="label" for="editor-mode">Edit action</label>
                <select id="editor-mode" class="field mt-2">
                  <option value="extract">Extract pages</option>
                  <option value="merge">Merge PDFs</option>
                  <option value="rotate">Rotate PDF</option>
                </select>
              </div>
              <div>
                <label class="label" for="editor-files">Files</label>
                <input id="editor-files" type="file" accept=".pdf,application/pdf" class="file-field mt-2">
              </div>
              <div id="page-range-wrap">
                <label class="label" for="page-range">Pages</label>
                <input id="page-range" type="text" value="1" class="field mt-2">
              </div>
              <div id="rotation-wrap" class="hidden">
                <label class="label" for="rotation-degrees">Rotation</label>
                <select id="rotation-degrees" class="field mt-2">
                  <option value="90">90 degrees</option>
                  <option value="180">180 degrees</option>
                  <option value="270">270 degrees</option>
                </select>
              </div>
              <button id="edit-btn" class="primary-btn">
                <i class="bi bi-pencil-square" style="font-size:18px"></i>
                Apply
              </button>
              <p id="editor-status" class="status-text"></p>
            </div>
          </section>

          <section id="image-panel" class="tool-panel hidden">
            <div class="tool-card space-y-5">
              <div>
                <label class="label" for="image-files">Images</label>
                <input id="image-files" type="file" accept="image/*" multiple class="file-field mt-2">
              </div>
              <div>
                <div class="flex justify-between items-center">
                  <label class="label" for="image-quality">Quality</label>
                  <span id="image-quality-label" class="text-sm font-bold text-amber-400">70%</span>
                </div>
                <input id="image-quality" type="range" min="10" max="95" value="70" class="w-full bg-slate-700 mt-3">
              </div>
              <div>
                <label class="label" for="image-max-width">Max width</label>
                <input id="image-max-width" type="number" min="100" step="50" value="1600" class="field mt-2">
              </div>
              <button id="image-compress-btn" class="primary-btn">
                <i class="bi bi-image" style="font-size:18px"></i>
                Compress Images
              </button>
              <p id="image-status" class="status-text"></p>
            </div>
          </section>
        </div>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
